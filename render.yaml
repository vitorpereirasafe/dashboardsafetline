services:
  - type: web
    name: dashboard-pcp
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dashboard-pcp-db
          property: connectionString

databases:
  - name: dashboard-pcp-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: dashboard_pcp
    user: dashboard_pcp_user
    ipAllowList: []
